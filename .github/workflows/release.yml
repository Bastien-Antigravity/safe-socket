# [FLEET-ARCHITECT] Fleet Polyglot Release
# Sync-ID: 2026-05-11-GLOBAL-001
name: Fleet Release

on:
  push:
    tags: ['v*']

env:
  GOPRIVATE: 'github.com/Bastien-Antigravity/*'

jobs:
  build_artifacts:
    name: Build Artifacts on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Verify Tag & Version Parity
        shell: bash
        run: |
          if [ ! -f VERSION.txt ]; then
            echo "ERROR: VERSION.txt is missing!" >&2
            exit 1
          fi
          VERSION=$(tr -d '[:space:]' < VERSION.txt)
          if [ -z "$VERSION" ]; then
            echo "ERROR: VERSION.txt is empty!" >&2
            exit 1
          fi
          EXPECTED_TAG="v${VERSION}"
          if [ "${GITHUB_REF_NAME}" != "${EXPECTED_TAG}" ]; then
            echo "ERROR: Release tag '${GITHUB_REF_NAME}' does not match VERSION.txt ('${VERSION}', expected '${EXPECTED_TAG}')" >&2
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Release version verified: $VERSION (tag: $GITHUB_REF_NAME)"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Resolve Sibling Dependencies
        shell: bash
        run: |
          if [ -f "go.mod" ]; then
            dropped_replace=false
            while IFS= read -r line; do
              target=$(echo "$line" | awk '{print $NF}')
              mod=$(echo "$line" | awk '{print $1}')
              repo_dir=$(basename "$target")
              if [ ! -d "$target" ]; then
                echo "Cloning missing sibling dependency: $repo_dir into $target..."
                git clone --depth 1 "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/Bastien-Antigravity/$repo_dir.git" "$target" 2>/dev/null || true
              fi
              if [ ! -d "$target" ]; then
                echo "Target $target still missing, dropping replace directive for $mod"
                go mod edit -dropreplace "$mod"
                dropped_replace=true
              fi
            done < <(grep -E '=> \.\./' go.mod || true)
            if [ "$dropped_replace" = true ]; then
              GOWORK=off go mod tidy
            fi
          fi

      - name: Build Shared Libraries
        shell: bash
        run: |
          case "${{ runner.os }}" in
            macOS)   LIB_EXT="dylib" ;;
            Windows) LIB_EXT="dll" ;;
            *)       LIB_EXT="so" ;;
          esac
          mkdir -p safesock/libsafesocket
          GOWORK=off go build -buildmode=c-shared -o "safesock/libsafesocket/libsafesocket.${LIB_EXT}" ./cmd/libsafesocket
          if [ "${{ runner.os }}" = "macOS" ]; then
            install_name_tool -id @rpath/libsafesocket.dylib safesock/libsafesocket/libsafesocket.dylib 2>/dev/null || true
          fi
          test -f "safesock/libsafesocket/libsafesocket.${LIB_EXT}"
          test -f "safesock/libsafesocket/libsafesocket.h"
          GOWORK=off go build ./...

      - name: Package Python SDK
        shell: bash
        run: |
          case "${{ runner.os }}" in
            macOS)   LIB_EXT="dylib" ;;
            Windows) LIB_EXT="dll" ;;
            *)       LIB_EXT="so" ;;
          esac
          PYTHON_DIRS=$(find . -maxdepth 3 \( -name "pyproject.toml" -o -name "setup.py" \) -not -path "*/.*" -exec dirname {} \; | sort -u)
          if [ -z "$PYTHON_DIRS" ]; then
            echo "ERROR: No Python packages found!" >&2
            exit 1
          fi
          cp -f "safesock/libsafesocket/libsafesocket.${LIB_EXT}" safesock/python/safesocket/
          cp -f safesock/libsafesocket/*.h safesock/python/safesocket/
          PLAT_TAG=$(python -c "import sysconfig; print(sysconfig.get_platform().replace('-', '_').replace('.', '_'))")
          for dir in $PYTHON_DIRS; do
            echo "--- Packaging Python SDK in $dir (platform: $PLAT_TAG) ---"
            cd "$dir"
            python -m pip install --upgrade pip build setuptools wheel
            python -m build --wheel -C--build-option="--plat-name=${PLAT_TAG}"
            cd - > /dev/null
          done

      - name: Run Unit & Import Smoke Tests
        shell: bash
        run: |
          GOWORK=off go test ./src/utils ./src/interfaces ./src/transports ./src/factory
          python -m pip install --force-reinstall safesock/python/dist/*.whl
          python -c "import safesocket; print('safesocket import smoke OK')"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.os }}
          path: |
            safesock/python/dist/*.whl
            safesock/libsafesocket/*.so
            safesock/libsafesocket/*.dll
            safesock/libsafesocket/*.dylib
            safesock/libsafesocket/*.h

  release:
    name: Create GitHub Release
    needs: build_artifacts
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
